provider = "claude-code"

# How many provider jobs the daemon may run at once (integer 1-4, default 2).
# Daemon-wide, never per run: it bounds a modular draft's module jobs, which
# are the reason it exists. Read once when the worker pool starts, so a change
# takes effect when the daemon restarts.
# [jobs]
# parallelism = 2

[stages.profile]
recommendation = "fast_or_strong_summary"
model = "sonnet-5"
effort = "medium"

[stages.spec]
recommendation = "strong_contract_design"
model = "fable-5"
effort = "high"

[stages.outline]
recommendation = "premium_reasoning"
model = "opus-4-8"
effort = "high"

[stages.draft]
recommendation = "strong_longform_generation"
model = "opus-4-8"
effort = "medium"
# Optional per-stage cap on provider run time, in seconds (default: 1800):
# timeout_seconds = 3600

[stages.qa]
recommendation = "fast_cheap_check"
model = "haiku-4-5"
effort = "medium"

[stages.factcheck]
recommendation = "strong_adversarial_check"
model = "opus-4-8"
effort = "medium"

[stages.repair]
recommendation = "strong_or_premium_repair"
model = "opus-4-8"
effort = "medium"

[stages.audit]
recommendation = "strong_personalization_audit"
model = "opus-4-8"
effort = "medium"
