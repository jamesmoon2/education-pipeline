name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: python -m pip install -e ".[dev]"

      - name: Import check
        run: python -c "import education_pipeline"

      - name: Unit tests
        run: python -m pytest

      - name: CLI smoke test
        run: |
          education-pipeline --help
          python -m education_pipeline --help

  web:
    name: web (unit + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Type-check and production build
        run: npm run build

  e2e:
    name: e2e (guide + mixed-run acceptance)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: python -m pip install -e .

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: web

      - name: Build cockpit
        run: npm run build
        working-directory: web

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
        working-directory: web

      - name: Guide and mixed-run acceptance suite
        run: npm run e2e
        working-directory: web

  packaging-smoke:
    # Verifies package installation on every supported OS (PRD §10 P2):
    # build the wheel once per OS, install it into a clean venv, and assert
    # the installed CLI works and `ui` serves the bundled cockpit.
    name: packaging smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        # bash exists on all three runners; keeps the steps single-source.
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        run: npm ci
        working-directory: web

      - name: Build cockpit and bundle into the package
        run: python scripts/build_webdist.py

      - name: Build the wheel
        run: |
          python -m pip install build
          python -m build --wheel

      - name: Install the wheel into a clean venv
        run: |
          python -m venv "$RUNNER_TEMP/smoke-venv"
          if [ -x "$RUNNER_TEMP/smoke-venv/bin/python" ]; then
            VENV_PY="$RUNNER_TEMP/smoke-venv/bin/python"
          else
            VENV_PY="$RUNNER_TEMP/smoke-venv/Scripts/python.exe"
          fi
          echo "VENV_PY=$VENV_PY" >> "$GITHUB_ENV"
          "$VENV_PY" -m pip install dist/*.whl

      - name: Installed CLI smoke test
        run: |
          "$VENV_PY" -m education_pipeline --help > /dev/null
          "$VENV_PY" -m education_pipeline blueprints > /dev/null

      # Known v0.1 gap: the daemon cannot run on Windows —
      # lifecycle.is_pid_alive probes with os.kill(pid, 0), which on Windows
      # unconditionally terminates the target process, so any liveness check
      # would kill the daemon it is checking. The manual CLI path works on
      # Windows; daemon/cockpit support is tracked in
      # docs/release-checklist.md (PRD §15 open question 5).
      - name: Launch ui headless and assert the cockpit index is served
        if: runner.os != 'Windows'
        run: |
          mkdir -p "$RUNNER_TEMP/smoke-ws"
          "$VENV_PY" -m education_pipeline ui --workspace "$RUNNER_TEMP/smoke-ws" --no-browser
          "$VENV_PY" - <<'PYEOF'
          import json, os, pathlib, urllib.request
          workspace = pathlib.Path(os.environ["RUNNER_TEMP"]) / "smoke-ws"
          record = json.loads((workspace / ".education-pipeline" / "daemon.json").read_text(encoding="utf-8"))
          with urllib.request.urlopen(f"http://127.0.0.1:{record['port']}/") as response:
              head = response.read(512).decode("utf-8", "replace")
          assert "<!doctype html" in head.lower(), head
          print(f"cockpit index served on port {record['port']}")
          PYEOF
          "$VENV_PY" -m education_pipeline --workspace "$RUNNER_TEMP/smoke-ws" daemon stop

  artifact-leak:
    name: no private artifacts committed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fail if user workspace data is tracked
        run: |
          # These directories hold generated runs and private topics/profiles
          # and must never be committed to the package repository.
          leaked=$(git ls-files -- 'runs/**' 'topics/**' 'profiles/**' 'queue/**' '.remember/**')
          if [ -n "$leaked" ]; then
            echo "Private workspace artifacts committed to the repo:" >&2
            echo "$leaked" >&2
            exit 1
          fi
          echo "No private workspace artifacts tracked."
