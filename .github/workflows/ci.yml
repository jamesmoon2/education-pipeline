name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: python -m pip install -e ".[dev]"

      - name: Import check
        run: python -c "import education_pipeline"

      - name: Unit tests
        run: python -m pytest

      - name: CLI smoke test
        run: |
          education-pipeline --help
          python -m education_pipeline --help

  web:
    name: web (unit + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Type-check and production build
        run: npm run build

  e2e:
    name: e2e (guide + mixed-run acceptance)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: python -m pip install -e .

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: web

      - name: Build cockpit
        run: npm run build
        working-directory: web

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
        working-directory: web

      - name: Guide and mixed-run acceptance suite
        run: npm run e2e
        working-directory: web

  packaging-smoke:
    name: packaging smoke (wheel serves the cockpit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        run: npm ci
        working-directory: web

      - name: Build cockpit and bundle into the package
        run: python scripts/build_webdist.py

      - name: Build the wheel
        run: |
          python -m pip install build
          python -m build --wheel

      - name: Install the wheel into a clean venv
        run: |
          python -m venv /tmp/smoke-venv
          /tmp/smoke-venv/bin/pip install dist/*.whl

      - name: Launch ui headless and assert the cockpit index is served
        run: |
          mkdir -p /tmp/smoke-ws
          /tmp/smoke-venv/bin/education-pipeline ui --workspace /tmp/smoke-ws --no-browser
          PORT=$(python -c "import json; print(json.load(open('/tmp/smoke-ws/.education-pipeline/daemon.json'))['port'])")
          curl -fsS "http://127.0.0.1:${PORT}/" | grep -qi "<!doctype html"
          echo "cockpit index served on port ${PORT}"
          /tmp/smoke-venv/bin/education-pipeline --workspace /tmp/smoke-ws daemon stop

  artifact-leak:
    name: no private artifacts committed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fail if user workspace data is tracked
        run: |
          # These directories hold generated runs and private topics/profiles
          # and must never be committed to the package repository.
          leaked=$(git ls-files -- 'runs/**' 'topics/**' 'profiles/**' 'queue/**' '.remember/**')
          if [ -n "$leaked" ]; then
            echo "Private workspace artifacts committed to the repo:" >&2
            echo "$leaked" >&2
            exit 1
          fi
          echo "No private workspace artifacts tracked."
