[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "education-pipeline"
version = "0.1.0"
description = "Local-first, prompt-first tooling for building interactive education guides."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "education-pipeline contributors" }]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
education-pipeline = "education_pipeline.cli:main"

[tool.setuptools.packages.find]
include = ["education_pipeline*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
